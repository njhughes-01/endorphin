# Ender 5 -> Endorphin: Vz Printhead, REAR belt clips, Sherpa Mini (pancake), V6 clone,
# BLTouch, stock 12864 screen, BTT SKR Mini E3 V2.0 (Klipper).
#
# A complete, printing config from a real build (2026-10). Use it as a reference:
#   - kinematics: hybrid_corexy_rear_belt  (see docs/rear-belt-kinematics)
#   - every value tagged "measured" or "user-set" is specific to THIS machine; measure yours
#   - PID values and z_offset are left out on purpose (see the end of this file)
#
# MCU firmware is stock Klipper (make menuconfig): STM32F103, 28KiB bootloader,
# USB on PA11/PA12, "GPIO pins to set at micro-controller startup" = !PA14.

[include mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_REPLACE_ME-if00   # ls /dev/serial/by-id/

[printer]
kinematics: hybrid_corexy_rear_belt   # rear belt clips — see endorphin docs/rear-belt-kinematics.md
max_velocity: 250
max_accel: 4000
max_z_velocity: 10                  # was 5 (Klipper generic); Marlin ran this Z at 20
max_z_accel: 100

[stepper_x]
step_pin: PB13
dir_pin: PB12                       # flipped 2026-10-21: X homed away from endstop
enable_pin: !PB14
microsteps: 16
rotation_distance: 40               # Marlin 80 steps/mm
endstop_pin: ^PC0
position_endstop: 235               # Endorphin homes X to max; bed 235 matches Elegoo profile printable_area
position_max: 235
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.800                  # Marlin X_CURRENT 800
stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
dir_pin: !PB2                       # verified: homes to the rear (max) switch
enable_pin: !PB11
microsteps: 16
rotation_distance: 40               # Marlin 80 steps/mm
endstop_pin: ^PC1
position_endstop: 207               # user-set 2026-10-22 (rail ~1 mm past old 208)
position_max: 207
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.800                  # Marlin Y_CURRENT 800
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: !PC5                       # flipped 2026-10-21: +Z moved bed UP
enable_pin: !PB1
microsteps: 16
rotation_distance: 8                # Marlin 400 steps/mm
endstop_pin: probe:z_virtual_endstop
position_min: -10
position_max: 300                   # Marlin Z_MAX_POS
homing_speed: 8

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.800                  # Marlin Z_CURRENT 800
stealthchop_threshold: 999999

[extruder]
step_pin: PB3
dir_pin: PB4                        # flipped 2026-10-22: Sherpa Mini ran backwards
enable_pin: !PD2
microsteps: 16
rotation_distance: 22.6789511       # Sherpa Mini (standard value)
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F # stock Creality thermistor moved into the V6 clone; genuine E3D = different type
sensor_pin: PA0
min_temp: 0
max_temp: 275                       # Marlin HEATER_0_MAXTEMP
max_extrude_only_distance: 100

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.600                  # Sherpa Mini pancake motor
stealthchop_threshold: 999999

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F # Marlin TEMP_SENSOR_BED 1
sensor_pin: PC3
min_temp: 0
max_temp: 125                       # Marlin BED_MAXTEMP

[bltouch]
sensor_pin: ^PC14
control_pin: PA1
x_offset: -28                       # measured 2026-10-22: nozzle on dot at 89,44; pin on dot at 117,55
y_offset: -11                       # pin is 28 mm left of and 11 mm in front of the nozzle
stow_on_each_sample: False        # pin stays down for the whole mesh (horizontal_move_z keeps 3 mm clearance)
lift_speed: 10                      # faster retract between samples (probe speed stays 5 for accuracy)
#z_offset: run PROBE_CALIBRATE, then SAVE_CONFIG

[safe_z_home]
home_xy_position: 145.5, 114.5      # probe lands at bed centre (117.5 + 28, 103.5 + 11)
z_hop: 10
z_hop_speed: 10

[bed_mesh]
speed: 200                          # travel between probe points (max_velocity is 250)
horizontal_move_z: 9                # must stay above bltouch z_offset (6.135); ~3 mm pin clearance
mesh_min: 15, 15                    # probe coords; 15 mm in from the front-left bed edges
mesh_max: 205, 195                  # probe coords; toolhead max is 235, 207 and the pin is -28, -11 from it
probe_count: 6, 6                   # full-bed density; ADAPTIVE=1 scales this down to the print area
algorithm: bicubic                  # Klipper drops to lagrange automatically for tiny adaptive meshes
adaptive_margin: 5                  # probe 5 mm past the printed objects
fade_start: 1
fade_end: 10

[heater_fan heatbreak_cooling_fan]
pin: PC7
heater: extruder
heater_temp: 50.0

[fan]
pin: PC6

[static_digital_output usb_pullup_enable]
pins: !PA14

[exclude_object]

[board_pins]
aliases:
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8,  EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PB15, EXP1_10=<5V>

# Stock Ender 5 Creality 12864 screen, single ribbon to SKR EXP1 (Klipper config/sample-lcd.cfg)
[display]
lcd_type: st7920
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2

[output_pin beeper]
pin: EXP1_1

[force_move]
enable_force_move: True

# Slicer start G-code:
#   Cura:  PRINT_START BED={material_bed_temperature_layer_0} EXTRUDER={material_print_temperature_layer_0}
#   Orca/Prusa: PRINT_START BED=[bed_temperature_initial_layer_single] EXTRUDER=[nozzle_temperature_initial_layer]
[gcode_macro PRINT_START]
description: Parallel heat-up, home, adaptive mesh, adaptive purge
gcode:
    UPDATE_DELAYED_GCODE ID=_AUTO_POWER_OFF DURATION=0   ; new print: cancel pending auto-off
    {% set BED = params.BED|default(60)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(200)|float %}
    {% set STANDBY = [EXTRUDER - 50, 150]|max if EXTRUDER > 150 else EXTRUDER %}
    M140 S{BED}                     ; bed first: the slowest heater, starts immediately
    M104 S{STANDBY}                 ; nozzle 50 C under target: hot, but below PETG ooze
    M107
    CLEAR_PAUSE
    BED_MESH_CLEAR
    G90
    M117 Homing
    G28                             ; home while both heaters ramp
    {% if BED > 0 %}
      M117 Heating bed
      TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED - 2}   ; no +/-1 C settle wait like M190
    {% endif %}
    M104 S{EXTRUDER}                ; final nozzle climb overlaps the mesh
    M117 Probing print area
    BED_MESH_CALIBRATE ADAPTIVE=1   ; probed hot, so it already absorbs bed expansion
    {% if EXTRUDER > 0 %}
      M117 Heating nozzle
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER - 2}
    {% endif %}
    _ADAPTIVE_PURGE
    M117 Printing

[gcode_macro _ADAPTIVE_PURGE]
description: 30 mm purge line just in front of the printed objects
gcode:
    {% set objs = printer.exclude_object.objects %}
    {% set xs = [] %}{% set ys = [] %}
    {% for o in objs %}{% for pt in o.polygon %}
      {% set _ = xs.append(pt[0]) %}{% set _ = ys.append(pt[1]) %}
    {% endfor %}{% endfor %}
    {% set lim = printer.toolhead.axis_maximum %}
    {% set x0 = ([xs|min, 5]|max if xs else 5) %}
    {% set y0 = ([ys|min - 5, 3]|max if ys else 3) %}
    {% set x1 = [x0 + 30, lim.x - 5]|min %}
    G90
    G1 X{x0} Y{y0} Z5 F12000
    G1 Z0.4 F600
    M83
    G1 E8 F200                      ; prime: 3.3 mm/s filament = 8 mm^3/s (V6 PETG-safe)
    G1 X{x1} E{((x1 - x0) * 0.2)|round(2)} F1000   ; 0.48 mm^2 x 16.7 mm/s = 8 mm^3/s (V6 PETG-safe)
    G1 X{x1 + 5} E0 F6000           ; wipe off the end
    G1 E-0.5 F2400
    G1 Z2 F600
    G92 E0

[gcode_macro PRINT_END]
gcode:
    {% set z = printer.toolhead.position.z %}
    {% set zmax = printer.toolhead.axis_maximum.z %}
    G91
    G1 E-2 F2700
    G90
    G1 Z{ [z + 10, zmax]|min } F600
    G1 X200 Y170 F6000
    M104 S0
    M140 S0
    M107
    M84
    UPDATE_DELAYED_GCODE ID=_AUTO_POWER_OFF DURATION=120

# --- Filament runout + safe pause ------------------------------------------
# Sensor on the SKR Mini E3 V2 E0-STOP header (PC15). Named "runout" like the old setup.
[filament_switch_sensor runout]
switch_pin: ^PC15                   # VERIFY polarity: QUERY_FILAMENT_SENSOR SENSOR=runout with/without filament
pause_on_runout: True
runout_gcode:
    M117 Filament runout - paused
    RESPOND TYPE=error MSG="Filament runout: print paused. Load filament, then RESUME."
event_delay: 3.0
pause_delay: 0.5

# Mainsail's RESUME refuses to resume while the sensor still reads empty.
[gcode_macro _CLIENT_VARIABLE]
variable_runout_sensor: "filament_switch_sensor runout"
gcode:

# A paused print must never lose position. Stock idle_timeout (10 min) turns
# off heaters AND motors; with motors off the toolhead position is gone and
# the print cannot be resumed. While paused: cool only the nozzle (stops
# ooze/heat creep), keep the bed hot (part stays stuck) and keep every motor
# energised. Mainsail RESUME reheats the nozzle to its saved temp automatically.
[idle_timeout]
timeout: 600
gcode:
    {% if printer.pause_resume.is_paused %}
      M104 S0
      RESPOND MSG="Paused >10 min: nozzle off to prevent ooze. Bed and motors stay on; RESUME reheats."
    {% else %}
      TURN_OFF_HEATERS
      M84
    {% endif %}

# --- LED strip on the SKR Mini E3 V2 RGB header -----------------------------
[neopixel my_neopixel]
pin: PA8
chain_count: 30                     # VERIFY real LED count; extra count is harmless, too few leaves LEDs dark
color_order: GRB                    # VERIFY: if SET_LED RED=1 shows green, change to RGB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

# --- Auto power-off via Moonraker [power printer] (any Moonraker-supported smart plug) ---
# Runs 2 min after PRINT_END. Never powers off while a job is printing or PAUSED,
# and waits for the nozzle to drop below 50 C (keeps the hotend fan running for heat creep).
[delayed_gcode _AUTO_POWER_OFF]
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
      RESPOND MSG="Auto power-off skipped: a print is {printer.print_stats.state}"
    {% elif printer.extruder.temperature > 50 %}
      UPDATE_DELAYED_GCODE ID=_AUTO_POWER_OFF DURATION=60
    {% else %}
      RESPOND MSG="Auto power-off: switching printer plug off"
      {action_call_remote_method("set_device_power", device="printer", state="off")}
    {% endif %}

[gcode_macro AUTO_OFF_CANCEL]
description: Keep the printer powered after this print
gcode:
    UPDATE_DELAYED_GCODE ID=_AUTO_POWER_OFF DURATION=0
    RESPOND MSG="Auto power-off cancelled"

# Elegoo/Orca slicer names -> the same macros Cura uses
[gcode_macro START_PRINT]
gcode:
    PRINT_START BED={params.BED_TEMP|default(60)} EXTRUDER={params.EXTRUDER_TEMP|default(200)}

[gcode_macro END_PRINT]
gcode:
    PRINT_END

# --- Tuned on this machine (yours will differ; run them yourself) ------------
#   PID_CALIBRATE HEATER=extruder TARGET=255   -> Kp 21.959  Ki 1.251  Kd 96.346 (PETG temp)
#   PID_CALIBRATE HEATER=heater_bed TARGET=80  -> Kp 71.755  Ki 1.667  Kd 772.261
#   PROBE_CALIBRATE                            -> z_offset 6.135 (this BLTouch rides high)
#   SAVE_CONFIG writes these to the end of printer.cfg.
